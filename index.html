<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AIVA — Unify Chat (v5)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS — Radial Design System values used in the v30 baseline
   ============================================================ */
:root{
  --brand:#006CFA; --brand-ink:#fff;
  --se:#2da7ff; --pa:#d97706; --dr:#0f9d8f; --fi:#7c3aed; --crm-red:#e0393e; --is:#1e3a8a; --dm:#475569; --ca:#64748b; --fo:#0b7285;
  --success:#16a34a; --warning:#d97706; --danger:#dc2626; --info:#0891b2;
  --n-monitor:#0891b2; --n-rules:#b45309; --n-auto:#7c3aed;
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f1f3f6; --surface-3:#e9ecf1;
  --border:#e2e6ec; --border-strong:#cfd5de;
  --text:#14171c; --text-2:#525c6b; --text-3:#8a93a1;
  --user-bubble:#eaf2ff; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06);
  --r:12px; --rail-w:264px; --canvas-w:min(46vw,640px);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
html[data-theme="dark"]{
  --bg:#0e1014; --surface:#161920; --surface-2:#1c2028; --surface-3:#242935;
  --border:#2a2f3a; --border-strong:#3a4150;
  --text:#e9ecf1; --text-2:#a6afbd; --text-3:#727c8c;
  --user-bubble:#1b2a44; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  --is:#6d8cf0; --dm:#94a3b8;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);font-size:14px;line-height:1.5;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.dag{color:var(--text-3);font-weight:500;margin-left:1px;font-size:.8em;vertical-align:super}
.mono{font-family:var(--mono)}

/* ============================================================ APP GRID */
.app{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr) 0;grid-template-rows:100vh;height:100vh;overflow:hidden;transition:grid-template-columns .25s ease}
.app.rail-min{--rail-w:64px}
.app.canvas-open{grid-template-columns:var(--rail-w) minmax(0,1fr) var(--canvas-w)}

/* ============================================================ RAIL */
.rail{background:var(--surface-2);border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.rail-top{display:flex;align-items:center;gap:10px;padding:14px 14px 10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:.2px;white-space:nowrap}
.brand small{font-weight:500;color:var(--text-3);font-size:11.5px;margin-left:2px}
/* CDK dot — from the master prototype's .logo: white circle, near-black mark, weight 900 */
.cdk-dot{--dot:32px;width:var(--dot);height:var(--dot);border-radius:50%;background:#fff;color:#0a0a0c;border:2px solid #0a0a0c;box-sizing:border-box;font-family:inherit;font-size:calc(var(--dot) * .316);font-weight:900;letter-spacing:-.3px;line-height:1;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;cursor:pointer;transition:transform .18s}
.cdk-dot:hover{transform:scale(1.04)}
html[data-theme="dark"] .cdk-dot{border-color:#fff}
.mark{flex-shrink:0;display:inline-block}
.icon-btn{border:0;background:transparent;width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-2);flex-shrink:0}
.icon-btn:hover{background:var(--surface-3);color:var(--text)}
.rail-top .icon-btn{margin-left:auto}
.rail-new{margin:4px 12px 8px;display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-weight:600;white-space:nowrap}
.rail-new:hover{border-color:var(--border-strong)}
.rail-nav{display:flex;flex-direction:column;padding:0 8px;gap:2px}
.rail-link{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:0;background:none;text-align:left;color:var(--text-2);white-space:nowrap}
.rail-link:hover,.rail-link.on{background:var(--surface-3);color:var(--text)}
.rail-link .count{margin-left:auto;font-size:11px;background:var(--n-auto);color:#fff;border-radius:10px;padding:0 7px;line-height:18px}
.rail-scroll{flex:1;overflow:auto;padding:6px 8px}
.rail-h{font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.6px;padding:12px 10px 4px}
.th{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--text-2)}
.th:hover{background:var(--surface-3)}
.th.on{background:var(--surface);color:var(--text);box-shadow:inset 0 0 0 1px var(--border)}
.th span.t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th .icon-btn{width:24px;height:24px;opacity:0}
.th:hover .icon-btn,.th .icon-btn.pinned{opacity:1}
.rail-foot{border-top:1px solid var(--border);padding:10px;display:flex;flex-direction:column;gap:6px;position:relative}
.persona-btn{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border:0;border-radius:10px;background:none;text-align:left}
.persona-btn:hover{background:var(--surface-3)}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;flex-shrink:0}
.persona-btn .who{min-width:0}
.persona-btn .who b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.persona-btn .who small{color:var(--text-3);font-size:11.5px}
.foot-row{display:flex;gap:4px}
.foot-row .rail-link{flex:1;font-size:12.5px;padding:6px 8px}
.app.rail-min .rail .hide-min{display:none}
.app.rail-min .rail-new{justify-content:center;padding:9px 0}
.app.rail-min .rail-link{justify-content:center}
.app.rail-min .persona-btn{justify-content:center}
.app.rail-min .foot-row{flex-direction:column}
.menu{position:absolute;bottom:calc(100% - 4px);left:10px;width:280px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:40;display:none;max-height:70vh;overflow:auto}
.menu.show{display:block}
.menu .mh{font-size:11px;color:var(--text-3);padding:6px 8px;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:7px 8px;border-radius:8px;text-align:left}
.menu button:hover{background:var(--surface-2)}
.menu button.on{background:var(--surface-2);font-weight:600}
.menu .avatar{width:24px;height:24px;font-size:10px}

/* ============================================================ MAIN */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;background:var(--bg);position:relative}
.top{height:56px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(6px);flex-shrink:0}
.top h1{font-size:14.5px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top .sp{flex:1}
.legend{display:flex;gap:6px}
.node{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.5px;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap;background:color-mix(in srgb,currentColor 8%,transparent)}
.node::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.node.monitor{color:var(--n-monitor)} .node.rules{color:var(--n-rules)} .node.auto{color:var(--n-auto)}
.node .lock{font-size:10px}
.chip-store{font-size:12px;color:var(--text-2);border:1px solid var(--border);padding:4px 10px;border-radius:999px;background:var(--surface);white-space:nowrap}
.btn{border:1px solid var(--border);background:var(--surface);padding:6px 12px;border-radius:9px;font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--border-strong)}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.auto{background:var(--n-auto);border-color:var(--n-auto);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:8px}

.scroll{flex:1;overflow:auto;scroll-behavior:smooth}
.col{max-width:800px;margin:0 auto;padding:28px 24px 40px}

/* turns */
.turn{margin:0 0 28px;animation:rise .25s ease}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.turn.user{display:flex;justify-content:flex-end}
.turn.user .bubble{background:var(--user-bubble);padding:10px 14px;border-radius:16px 16px 4px 16px;max-width:78%;white-space:pre-wrap}
.turn.user .ref{display:inline-block;font-size:12px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:0 6px;margin-right:4px}
.turn.ai{display:grid;grid-template-columns:32px minmax(0,1fr);gap:14px}
.ai-av{width:32px;height:32px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.turn.ai.streaming .ai-av .mark{animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-head{display:flex;align-items:center;gap:8px;margin:4px 0 8px;flex-wrap:wrap}
.trace{font-size:12px;color:var(--text-3)}
.trace summary{cursor:pointer;list-style:none;display:inline-flex;gap:6px;align-items:center}
.trace summary::-webkit-details-marker{display:none}
.trace[open] summary{color:var(--text-2)}
.trace ul{margin:6px 0 0;padding-left:18px}
.thinking{display:inline-flex;gap:3px;margin-left:4px}
.thinking i{width:4px;height:4px;border-radius:50%;background:var(--text-3);animation:blink 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.lead{font-size:15px;line-height:1.6;margin:0 0 4px}
.lead b{font-weight:600}
.caret::after{content:"";display:inline-block;width:7px;height:15px;background:var(--text);margin-left:2px;vertical-align:-2px;animation:blink 1s infinite}
.blk{margin-top:14px;animation:rise .3s ease}
.msg{margin:0;line-height:1.6}
.sec-h{font-size:12px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.6px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.sec-h .line{flex:1;height:1px;background:var(--border)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.tbl th{text-align:left;font-weight:600;color:var(--text-2);font-size:12px;background:var(--surface-2);padding:8px 12px;border-bottom:1px solid var(--border)}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--surface-2)}
.src{font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.src code{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);padding:1px 6px;border-radius:5px;color:var(--text-2)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--border);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.chip.open{border-color:var(--brand);color:var(--brand);background:color-mix(in srgb,var(--brand) 7%,var(--surface))}
.chip.open.active{background:var(--brand);color:#fff}
.lim{border-left:3px solid var(--text-3);background:var(--surface-2);padding:10px 14px;border-radius:0 10px 10px 0;font-size:13.5px;color:var(--text-2)}
.lim b{color:var(--text)}
.clar{display:flex;flex-direction:column;gap:8px}
.clar button{text-align:left;border:1px solid var(--border);background:var(--surface);padding:10px 14px;border-radius:10px;display:flex;gap:10px;align-items:center}
.clar button:hover{border-color:var(--brand)}
.clar button small{color:var(--text-3);display:block;font-size:12px}
.feedback{display:flex;gap:2px;margin-top:12px;opacity:.65}
.turn.ai:hover .feedback{opacity:1}
.feedback .icon-btn{width:28px;height:28px}
.feedback .icon-btn.on{color:var(--brand)}
.fb-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.fb-tags button{font-size:11.5px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:2px 9px}
.fb-tags button.on{border-color:var(--brand);color:var(--brand)}

/* confirm card — AUTOMATION */
.cfm{border:1.5px solid var(--n-auto);border-radius:var(--r);background:color-mix(in srgb,var(--n-auto) 5%,var(--surface));padding:14px 16px}
.cfm .ch{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.cfm h4{margin:0;font-size:14px}
.cfm p{margin:0 0 10px;color:var(--text-2);font-size:13.5px}
.cfm ul{margin:0 0 12px;padding-left:18px;font-size:13px;color:var(--text-2)}
.cfm .row{display:flex;gap:8px;align-items:center}
.cfm.done{border-color:var(--success);background:color-mix(in srgb,var(--success) 6%,var(--surface))}
.cfm.cancel{border-color:var(--border-strong);background:var(--surface-2)}
.cfm .result{font-size:13px;font-weight:500}

/* briefing tasks */
.tasks{border:1px solid var(--border);border-radius:var(--r);background:var(--surface);overflow:hidden}
.task{display:grid;grid-template-columns:28px minmax(150px,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--border)}
.task:last-child{border-bottom:0}
.task:hover{background:var(--surface-2)}
.task .tt{font-weight:600;font-size:13.5px}
.task .ts{font-size:12.5px;color:var(--text-2)}
.task .tx{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pri{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px;text-transform:uppercase;letter-spacing:.4px;margin-left:6px;vertical-align:1px}
.pri.high{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.pri.med{background:color-mix(in srgb,var(--warning) 16%,transparent);color:var(--warning)}
.pri.low{background:var(--surface-3);color:var(--text-3)}

/* app tile */
.tile{--tile-px:28px;width:var(--tile-px);height:var(--tile-px);border-radius:calc(var(--tile-px)*.26);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:calc(var(--tile-px)*.345);letter-spacing:-.2px;flex-shrink:0;background:linear-gradient(140deg,color-mix(in srgb,var(--c) 78%,#fff) 0%,var(--c) 55%,color-mix(in srgb,var(--c) 70%,#000) 100%)}
.tile.two{font-size:calc(var(--tile-px)*.445)}
.tile.sm{--tile-px:22px}
.tile.lg{--tile-px:40px}

/* product part cards */
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px;min-width:0;transition:border-color .15s}
.card:hover{border-color:var(--border-strong)}
.card .chd{display:flex;align-items:center;gap:8px}
.card .chd b{font-size:12.5px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-2)}
.card .chd button{border:0;background:none;color:var(--text-3);font-size:12px;padding:2px 4px;border-radius:6px}
.card .chd button:hover{color:var(--brand);background:var(--surface-2)}
.amt{font-size:24px;font-weight:700;letter-spacing:-.4px;line-height:1.1}
.amt small{font-size:13px;color:var(--text-3);font-weight:500;letter-spacing:0;margin-left:6px}
.lbl{font-size:12px;color:var(--text-3)}
.trend{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:999px;display:inline-block}
.trend.up{color:var(--success);background:color-mix(in srgb,var(--success) 12%,transparent)}
.trend.down{color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,transparent)}
.trend.neutral{color:var(--text-3);background:var(--surface-3)}
.kv{display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.kv div{display:flex;justify-content:space-between;gap:8px}
.kv span{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv b{font-weight:600;white-space:nowrap}
.hb{display:flex;flex-direction:column;gap:7px}
.hb .r{font-size:12px}
.hb .r .t{display:flex;justify-content:space-between;margin-bottom:3px}
.hb .r .t span{color:var(--text-2)}
.bar{height:6px;background:var(--surface-3);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px}
.legend-sm{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--text-2)}
.legend-sm i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.donut-wrap{display:flex;align-items:center;gap:14px}

/* doc card */
.doc{display:flex;align-items:center;gap:12px;border:1px solid var(--border);background:var(--surface);border-radius:var(--r);padding:12px 14px}
.doc .di{width:34px;height:42px;border-radius:5px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:flex-end;justify-content:center;font-size:9px;font-weight:700;color:var(--danger);padding-bottom:4px;flex-shrink:0}
.doc .dm{flex:1;min-width:0}
.doc .dm b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc .dm small{color:var(--text-3);font-size:12px}

/* ============================================================ COMPOSER */
.composer-wrap{padding:0 24px 16px;flex-shrink:0;position:relative}
.composer{max-width:800px;margin:0 auto;background:var(--surface);border:1px solid var(--border-strong);border-radius:20px;box-shadow:var(--shadow);padding:10px 10px 8px 16px;position:relative}
.composer:focus-within{border-color:var(--brand)}
.composer textarea{width:100%;border:0;outline:0;resize:none;background:transparent;font:inherit;font-size:15px;color:var(--text);max-height:180px;min-height:26px;padding:4px 0}
.composer textarea::placeholder{color:var(--text-3)}
.c-row{display:flex;align-items:center;gap:4px}
.c-row .sp{flex:1}
.send{width:34px;height:34px;border-radius:50%;border:0;background:var(--brand);color:#fff;display:inline-flex;align-items:center;justify-content:center}
.send:disabled{background:var(--surface-3);color:var(--text-3);cursor:default}
.send.stop{background:var(--text)}
.mic.listening{color:var(--danger);animation:blink 1s infinite}
.fine{max-width:800px;margin:8px auto 0;text-align:center;font-size:11.5px;color:var(--text-3)}
.pop{position:absolute;bottom:calc(100% + 8px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:6px;display:none;max-height:320px;overflow:auto;z-index:30}
.pop.show{display:block}
.pop .ph{font-size:11px;color:var(--text-3);padding:6px 10px;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.pop button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:7px 10px;border-radius:8px;text-align:left}
.pop button.sel,.pop button:hover{background:var(--surface-2)}
.pop button small{color:var(--text-3);margin-left:auto;font-size:12px;white-space:nowrap}
.pop kbd{font-family:var(--mono);font-size:12px;color:var(--brand)}

/* ============================================================ CANVAS */
.canvas{background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.app.canvas-open .legend{display:none}
.cv-head{height:56px;display:flex;align-items:center;gap:10px;padding:0 12px 0 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.cv-head h2{font-size:14.5px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv-head h2 small{color:var(--text-3);font-weight:500;margin-left:6px;font-size:12px}
.cv-body{flex:1;overflow:auto;padding:16px 18px 32px;background:var(--bg)}
.cv-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.cv-tabs button{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:12.5px;color:var(--text-2)}
.cv-tabs button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.cv-sec{margin:0 0 18px}
.rec{background:var(--surface);border:1.5px solid var(--brand);border-radius:var(--r);padding:14px 16px;margin-bottom:18px}
.rec h3{margin:0 0 2px;font-size:16px}
.rec .meta{color:var(--text-2);font-size:13px}
.paper{background:#fff;color:#1a1a1a;border:1px solid var(--border);border-radius:6px;padding:28px 30px;box-shadow:var(--shadow);transform-origin:top center;font-family:Georgia,serif}
.paper h4{text-align:center;letter-spacing:1px;margin:0 0 18px;font-family:var(--font);font-size:13px}
.paper table{width:100%;border-collapse:collapse;font-size:13px}
.paper td{border-bottom:1px solid #ddd;padding:7px 4px}
.paper td:first-child{color:#666;width:42%}
.paper .sig{margin-top:30px;border-top:1px solid #333;padding-top:6px;font-size:11px;color:#666;display:flex;justify-content:space-between}
.paper .sig.empty{border-top:2px dashed #dc2626;color:#dc2626}
.lanes{display:grid;grid-template-columns:90px minmax(0,1fr);gap:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.lane-h{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--text-3);padding:12px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);display:flex;align-items:center}
.lane-b{border-bottom:1px solid var(--border);padding:8px;display:flex;gap:6px;overflow-x:auto;min-height:54px;align-items:center}
.step-dot{min-width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-3);flex-shrink:0;background:var(--surface)}
.step-dot.done{background:var(--surface-3);color:var(--text-2)}
.step-dot.cur{border-color:var(--brand);background:var(--brand);color:#fff}
.run-cap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-top:14px}
.run-cap .uc{font-family:var(--mono);font-size:11px;color:var(--text-3)}
.run-cap p{margin:8px 0 12px;font-size:14.5px}
.empty-cv{color:var(--text-3);text-align:center;padding:40px 10px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:all .2s;z-index:90;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:1280px){
  .app.canvas-open{grid-template-columns:var(--rail-w) minmax(0,1fr) 0}
  .app.canvas-open .canvas{position:fixed;right:0;top:0;bottom:0;width:min(560px,92vw);z-index:50;box-shadow:-8px 0 32px rgba(0,0,0,.18)}
}

/* ============================================================
   MOBILE — one mode, keyed on .app.m (phone width OR preview toggle)
   ============================================================ */
.m-only{display:none!important}
.scrim{display:none}
.starters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.hero{text-align:center;padding:12vh 0 24px}
.app.m{grid-template-columns:minmax(0,1fr)!important;grid-template-rows:100%;height:100vh;height:100dvh;position:relative}
.app.m .m-only{display:inline-flex!important}
.app.m .d-only{display:none!important}
.app.m .rail{position:absolute;top:0;bottom:0;left:0;width:min(86%,320px);z-index:60;transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 40px rgba(0,0,0,.25);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.app.m.drawer .rail{transform:none}
.app.m .scrim{display:block;position:absolute;inset:0;background:rgba(0,0,0,.38);z-index:59;opacity:0;pointer-events:none;transition:opacity .25s}
.app.m.drawer .scrim{opacity:1;pointer-events:auto}
.app.m .rail-top .icon-btn{display:none}
.app.m .rail-link,.app.m .th{min-height:44px}
.app.m .th .icon-btn{opacity:1;width:36px;height:36px}
.app.m .top{height:auto;min-height:52px;padding:env(safe-area-inset-top) 6px 0;gap:4px}
.app.m .top h1{flex:1;text-align:center;font-size:15px}
.app.m .top .sp,.app.m .legend,.app.m .chip-store,.app.m #canvasToggle{display:none}
.app.m .icon-btn{width:44px;height:44px;border-radius:12px}
.app.m .col{padding:14px 16px 20px}
.app.m .turn{margin-bottom:22px}
.app.m .turn.ai{grid-template-columns:minmax(0,1fr);gap:0}
.app.m .ai-av{display:none}
.app.m .turn.user .bubble{max-width:86%;border-radius:20px 20px 6px 20px}
.app.m .lead{font-size:15.5px}
.app.m .parts{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.app.m .parts::-webkit-scrollbar{display:none}
.app.m .parts{align-items:flex-start}
.app.m .parts>.card{flex:0 0 80%;scroll-snap-align:start;scroll-margin-left:16px}
.app.m .parts>.card:only-child{flex-basis:100%}
.app.m .cv-body .parts{display:grid;grid-template-columns:minmax(0,1fr);margin:0;padding:0;overflow:visible}
.app.m .cv-body .parts>.card{flex:none}
.app.m .task{grid-template-columns:32px minmax(0,1fr);row-gap:8px;padding:12px}
.app.m .task .tx{grid-column:2;justify-content:flex-start}
.app.m .task .btn{min-height:36px}
.app.m .tbl{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
.app.m .tbl td,.app.m .tbl th{white-space:nowrap}
.app.m .chip{min-height:38px;padding:8px 14px}
.app.m .acts{gap:8px;flex-wrap:nowrap;overflow-x:auto;margin-left:-16px;margin-right:-16px;padding:0 16px 2px;scrollbar-width:none}
.app.m .acts::-webkit-scrollbar{display:none}
.app.m .acts .chip{white-space:nowrap;flex-shrink:0}
.app.m .feedback{opacity:1}
.app.m .clar button{min-height:52px}
.app.m .cfm .row{flex-wrap:wrap}
.app.m .cfm .btn{min-height:42px;padding:8px 18px}
.app.m .cfm .row .lbl{margin-left:0!important;width:100%}
.app.m .starters{grid-template-columns:minmax(0,1fr);gap:8px}
.app.m .starters .card{padding:12px 14px}
.app.m .hero{padding:6vh 0 18px}
.app.m .hero h2{font-size:22px!important}
.app.m .composer-wrap{padding:6px 10px calc(8px + env(safe-area-inset-bottom));background:var(--bg)}
.app.m .composer{border-radius:24px;padding:8px 6px 6px 14px}
.app.m .composer textarea{font-size:16px}
.app.m .send{width:40px;height:40px}
.app.m .fine{font-size:10.5px;margin-top:6px}
.app.m .fine .long,.app.m .fine .dsk{display:none}
.fine .mob{display:none}
.app.m .fine .mob{display:inline}
.app.m .pop{max-height:46vh}
.app.m .pop button{min-height:44px}
.app.m .canvas{position:absolute!important;inset:0!important;width:auto!important;z-index:55;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:none;border-left:0;padding-bottom:env(safe-area-inset-bottom)}
.app.m.canvas-open .canvas{transform:none}
.app.m .cv-head{padding:env(safe-area-inset-top) 8px 0 14px;height:auto;min-height:52px}
.app.m .cv-body{padding:14px 14px 28px}
.app.m .cv-tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.app.m .cv-tabs button{min-height:36px;white-space:nowrap}
.app.m .paper{padding:20px 18px}
.app.m .lanes{grid-template-columns:76px minmax(0,1fr)}
.app.m .menu{left:8px;right:8px;width:auto;bottom:calc(100% + 4px);max-height:60vh}
.app.m .menu button{min-height:44px}
.app.m .toast{bottom:auto;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-10px);text-align:center;width:max-content;max-width:86%}
.app.m .toast.show{transform:translateX(-50%) translateY(0)}
.app.m.preview .toast{top:84px}
/* Desktop preview: the same mobile mode in a phone frame */
body.preview-on{display:flex;align-items:center;justify-content:center;background:var(--surface-3);min-height:100vh}
.app.m.preview{width:390px;height:min(844px,calc(100vh - 48px));border-radius:44px;border:10px solid #0b0c0f;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden;transform:translateZ(0);background:var(--bg)}
.app.m.preview .top{padding-top:22px}
.app.m.preview .cv-head{padding-top:22px}
.app.m.preview .composer-wrap{padding-bottom:18px}
.exit-preview{position:fixed;top:16px;right:16px;z-index:100;display:none}
body.preview-on .exit-preview{display:inline-flex}
html.mobile-ua .exit-preview,html.mobile-ua #modeBtn{display:none!important}
html.mobile-ua body.preview-on{display:block;background:var(--bg)}
html.mobile-ua .app.m.preview{width:auto;height:100dvh;border:0;border-radius:0;box-shadow:none;transform:none}
.toast{position:absolute}
@media (hover:none){.th .icon-btn{opacity:1}.feedback{opacity:1}}
</style>
</head>
<body>
<div class="app" id="app">
  <!-- ============================ RAIL ============================ -->
  <aside class="rail" aria-label="Threads">
    <div class="rail-top">
      <div class="brand"><button class="cdk-dot" id="cdkLogoBtn" title="My Dashboard" aria-label="CDK — go to today's briefing">CDK</button><span class="hide-min">Unify</span></div>
      <button class="icon-btn hide-min" id="railMin" title="Collapse sidebar" aria-label="Collapse sidebar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
    </div>
    <button class="rail-new" id="newChat" title="New chat"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg><span class="hide-min">New chat</span></button>
    <nav class="rail-nav">
      <button class="rail-link" id="navToday" title="Today's briefing"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="hide-min">Today</span></button>
      <button class="rail-link" id="navApps" title="Products"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span class="hide-min">Products</span></button>
      <button class="rail-link" id="navActivity" title="Activity log"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg><span class="hide-min">Activity</span><span class="count hide-min" id="logCount" hidden>0</span></button>
    </nav>
    <div class="rail-scroll hide-min" id="threadList"></div>
    <div class="rail-foot">
      <div class="menu" id="personaMenu" role="menu"></div>
      <button class="persona-btn" id="personaBtn" aria-haspopup="menu"></button>
      <div class="foot-row">
        <button class="rail-link" id="themeBtn" title="Toggle theme"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span class="hide-min">Theme</span></button>
        <button class="rail-link" id="modeBtn" title="Preview the mobile layout" aria-pressed="false"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg><span class="hide-min" id="modeLabel">Mobile view</span></button>
      </div>
    </div>
  </aside>

  <div class="scrim" id="scrim"></div>
  <!-- ============================ MAIN ============================ -->
  <main class="main">
    <header class="top">
      <button class="icon-btn m-only" id="menuBtn" title="Threads" aria-label="Open threads"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 12h11M4 17h16"/></svg></button>
      <h1 id="threadTitle">Today</h1>
      <span class="sp"></span>
      <div class="legend" id="legend"></div>
      <span class="chip-store" title="Store context">Statler Toyota</span>
      <button class="icon-btn m-only" id="mNewBtn" title="New chat" aria-label="New chat"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
      <button class="icon-btn" id="canvasToggle" title="Toggle canvas" aria-label="Toggle canvas"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M14 4v16"/></svg></button>
    </header>
    <div class="scroll" id="scroll"><div class="col" id="thread"></div></div>
    <div class="composer-wrap">
      <div class="composer">
        <div class="pop" id="pop" role="listbox"></div>
        <textarea id="input" rows="1" placeholder="Ask AIVA anything — / for commands, @ for records" aria-label="Message AIVA"></textarea>
        <div class="c-row">
          <button class="icon-btn" id="atBtn" title="Mention a record (@)" aria-label="Mention a record"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/></svg></button>
          <button class="icon-btn" id="slashBtn" title="Commands (/)" aria-label="Commands"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M14 7l-4 10"/></svg></button>
          <span class="sp"></span>
          <button class="icon-btn mic" id="micBtn" title="Voice (simulated)" aria-label="Voice input"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
          <button class="send" id="sendBtn" aria-label="Send" disabled><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
        </div>
      </div>
      <div class="fine"><span class="long">AIVA answers from Unify product data. </span><span class="dsk"><b>†</b> marks placeholder figures awaiting SME sign-off. Nothing is written without your confirmation.</span><span class="mob"><b>†</b> placeholder figure · nothing is written without your OK</span></div>
    </div>
  </main>

  <!-- ============================ CANVAS ============================ -->
  <section class="canvas" id="canvas" aria-label="Canvas">
    <div class="cv-head"><span id="cvTile"></span><h2 id="cvTitle">Canvas</h2><button class="btn ghost m-only" id="cvDone" style="font-weight:600;color:var(--brand)">Done</button><button class="icon-btn d-only" id="cvClose" title="Close canvas" aria-label="Close canvas"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="cv-body" id="cvBody"></div>
  </section>
  <div class="toast" id="toast"></div>
</div>
<button class="btn exit-preview" id="exitPreview">Exit mobile view</button>

function seeded(seed){ let s=seed||7; return ()=>{ s=(s*9301+49297)%233280; return s/233280; }; }
function spark(c){
  const r=seeded(c.sparkSeed), n=14, base=+c.sparkBase||1, vary=+c.sparkVary||1, pts=[];
  for(let i=0;i<n;i++) pts.push(base + (r()-.5)*vary + (c.trend&&c.trend.dir==="up"? i*vary/n*.6 : c.trend&&c.trend.dir==="down"? -i*vary/n*.6:0));
  const mn=Math.min(...pts), mx=Math.max(...pts), W=200, H=38;
  const xy=pts.map((v,i)=>[i*W/(n-1), H-4-(v-mn)/((mx-mn)||1)*(H-8)]);
  const d=xy.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join("");
  const col=c.sparkColor||"var(--brand)";
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}L${W} ${H}L0 ${H}z" fill="${col}" opacity=".1"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.8" vector-effect="non-scaling-stroke"/></svg>`;
}
function bars(c){
  const v=c.bars||[], mx=Math.max(...v)||1, W=200,H=38,bw=W/v.length;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" aria-hidden="true">${v.map((x,i)=>`<rect x="${(i*bw+2).toFixed(1)}" y="${(H-x/mx*H).toFixed(1)}" width="${(bw-4).toFixed(1)}" height="${(x/mx*H).toFixed(1)}" rx="2" fill="${c.barColor||"var(--brand)"}" opacity="${i===v.length-1?1:.45}"/>`).join("")}</svg>`;
}
function gauge(pct,col){
  const a=Math.PI*(1-Math.min(100,Math.max(0,pct))/100), r=34, cx=44, cy=42;
  const x=cx+r*Math.cos(a), y=cy-r*Math.sin(a);
  return `<svg width="88" height="50" viewBox="0 0 88 50" aria-hidden="true"><path d="M10 42A34 34 0 0 1 78 42" fill="none" stroke="var(--surface-3)" stroke-width="8" stroke-linecap="round"/><path d="M10 42A34 34 0 0 1 ${x.toFixed(1)} ${y.toFixed(1)}" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round"/><text x="44" y="40" text-anchor="middle" font-size="15" font-weight="700" fill="var(--text)">${pct}%</text></svg>`;
}
function donut(segs){
  let acc=0; const r=26, C=2*Math.PI*r;
  const arcs=segs.map(s=>{ const len=C*s.percent/100, o=`<circle cx="34" cy="34" r="${r}" fill="none" stroke="${s.color}" stroke-width="10" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}" transform="rotate(-90 34 34)"/>`; acc+=len; return o; }).join("");
  return arcs;
}
const AMT = c => `${esc(c.amountPrefix||"")}${esc(c.amount)}${esc(c.amountSuffix||"")}<span class="dag">†</span>`;

/* ==========================================================================
   aivaCiFind — context-item references. Runs BEFORE intent matching.
   ========================================================================== */
function buildIndex(){
  const idx=[];
  for(const a of allItems()) idx.push({kind:"item",label:a.text,sub:a.sub,app:a.icon,persona:a.persona,hay:(a.text+" "+a.sub).toLowerCase()});
  for(const c of CUSTOMERS) idx.push({kind:"customer",label:c.name,sub:c.sub,app:c.app,hay:(c.name+" "+c.sub).toLowerCase()});
  for(const d of DOCS) idx.push({kind:"doc",label:d.name,sub:`${d.packet} · ${d.status}`,app:"dm",doc:d.id,hay:(d.name+" "+d.packet+" "+d.title).toLowerCase()});
  return idx;
}
let INDEX=null;
function refTokens(text){
  const t=text.toLowerCase(), out=[];
  (t.match(/[a-z]{0,3}-?\d{4,7}(?:-\d+)?/g)||[]).forEach(x=>out.push(x.replace(/^[a-z]+-?/,"")));
  for(const c of CUSTOMERS){ const n=c.name.toLowerCase(), last=n.split(" ")[1]; if(t.includes(n)||new RegExp("\\b"+last+"\\b").test(t)) out.push(n); }
  return [...new Set(out)];
}
function aivaCiFind(text){
  INDEX=INDEX||buildIndex();
  const tl=text.toLowerCase();
  // A record named in full ("MPI Approval", "10:00 Arrival") is a reference too.
  // …unless the words are part of a dashboard title the user named ("Open Parts Requests").
  const ec=exactCard(text,S.persona);
  const named=INDEX.filter(e=>e.label.length>5&&tl.includes(e.label.toLowerCase())&&!(ec&&norm(ec.title).includes(norm(e.label))));
  if(named.length){
    const lab=named.sort((a,b)=>b.label.length-a.label.length)[0].label.toLowerCase();
    const num=(lab.match(/\d{4,7}/)||[])[0];
    const hits=INDEX.filter(e=>e.label.toLowerCase()===lab||(num&&e.hay.includes(num)));
    hits.sort((a,b)=>(b.label.toLowerCase()===lab)-(a.label.toLowerCase()===lab)||(b.persona===S.persona)-(a.persona===S.persona));
    return {tok:lab,hits};
  }
  const toks=refTokens(text); if(!toks.length) return null;
  const tok=toks[0];
  const cust=CUSTOMERS.find(c=>c.name.toLowerCase()===tok);
  const alt=cust?(()=>{ const [f,l]=cust.name.toLowerCase().split(" "); return l+", "+f[0]; })():null;
  const hits=INDEX.filter(e=>e.hay.includes(tok)||(alt&&e.hay.includes(alt)));
  if(!hits.length) return {tok,hits:[]};
  // Prefer what the current persona owns, then the most specific label.
  hits.sort((a,b)=>(b.persona===S.persona)-(a.persona===S.persona) || (b.label.toLowerCase().includes(tok))-(a.label.toLowerCase().includes(tok)));
  return {tok,hits};
}

  {id:"forecast",re:/\b(forecast|predict|projection|next year|five[- ]year|5[- ]year)\b/i},

function findApp(text){

  for(const [k,a] of Object.entries(APPS)) if(a.kw.some(w=>new RegExp("\\b"+w.replace(/[&]/g,"\\&")+"\\b").test(t))||t.includes(a.name.toLowerCase())) return k;
  return null;

const norm = s => s.toLowerCase().replace(/[^a-z0-9&+ ]/g," ").replace(/\s+/g," ").trim();
function exactCard(text,pk){ const t=norm(text); return (PERSONAS[pk].cards||[]).find(c=>t.includes(norm(c.title)))||null; }
function matchCard(text,pk){
  const t=norm(text);
  const words=t.split(/\s+/).filter(w=>w.length>2&&!["show","my","the","what","how","open","about","for","and","our","are","whats","tell","today"].includes(w));
  let best=null,score=0;
  for(const c of PERSONAS[pk].cards||[]){
    const tt=norm(c.title); let s=0;
    for(const w of words) if(tt.includes(w)) s+=w.length;
    if(t.includes(tt)) s+=50;
    if(s>score){score=s;best=c;}
  }
  return score>=4?best:null;
}
function aivaMatchIntent(text){
  if(!/^\//.test(text)){ const ec=exactCard(text,S.persona); if(ec) return {id:"card",card:ec}; }
  for(const it of INTENTS){
    if(!it.re.test(text)) continue;
    if(it.id==="openApp"){ const app=findApp(text); if(app) return {id:"openApp",app}; const c=matchCard(text,S.persona); if(c) return {id:"card",card:c}; continue; }
    return {id:it.id};
  }
  const c=matchCard(text,S.persona); if(c) return {id:"card",card:c};
  const app=findApp(text); if(app) return {id:"openApp",app};
  // Persona scope: a card that belongs to another role is named, not shown.
  for(const k of PERSONA_ORDER){ if(k===S.persona) continue; const oc=matchCard(text,k); if(oc) return {id:"outOfScope",card:oc,owner:k}; }
  return {id:"fallback"};
}

function htmlToText(h){ const d=document.createElement("div"); d.innerHTML=h; return d.textContent; }
function streamTurn(t){
  const el=$("#thread"); const wrap=document.createElement("div");
  wrap.innerHTML=aiTurnHTML(t,false); const node=wrap.firstElementChild; el.appendChild(node);
  node.classList.add("streaming");
  const lead=node.querySelector(".lead"), blocksEl=node.querySelector(".blocks"), head=node.querySelector(".ai-head");
  lead.innerHTML='<span class="thinking"><i></i><i></i><i></i></span>';
  const full=htmlToText(t.r.lead), words=full.split(/(\s+)/);
  let i=0, timers=[];
  const finish=()=>{
    timers.forEach(clearTimeout); timers=[];
    lead.classList.remove("caret"); lead.innerHTML=t.r.lead;
    blocksEl.innerHTML=t.r.blocks.map(b=>`<div class="blk">${blockHTML(b,t.id)}</div>`).join("");
    node.insertAdjacentHTML("beforeend",""); const inner=node.children[1];
    inner.insertAdjacentHTML("beforeend",chipsHTML(t.r.chips)+feedbackHTML(t.id));
    node.classList.remove("streaming"); S.streaming=null; setComposerState();
    if(t.r.after) { t.r.after(); }
    syncOpenButtons(); scrollDown();
  };
  S.streaming={stop:finish}; setComposerState();
  timers.push(setTimeout(()=>{
    lead.textContent=""; lead.classList.add("caret");
    const step=()=>{ if(i>=words.length){ lead.classList.remove("caret"); lead.innerHTML=t.r.lead;
        let k=0; const addBlock=()=>{ if(k>=t.r.blocks.length){ finish(); return; } blocksEl.insertAdjacentHTML("beforeend",`<div class="blk">${blockHTML(t.r.blocks[k],t.id)}</div>`); k++; syncOpenButtons(); scrollDown(); timers.push(setTimeout(addBlock,180)); };
        timers.push(setTimeout(addBlock,120)); return; }
      lead.textContent+=words.slice(i,i+3).join(""); i+=3; scrollDown(); timers.push(setTimeout(step,38)); };
    step();
  },560));
}

function seedThreads(pk){

function findCfm(id){ for(const th of Object.values(S.threads)) for(const t of th.turns) if(t.r) for(const b of t.r.blocks) if(b.t==="cfm"&&b.id===id) return {b,t}; return null; }

function resolveCfm(id,yes){

const COMMANDS=[["/today","Your briefing for today"],["/apps","Every product and what I can see"],["/runner","Play the cross-product flow"],["/activity","The audit log"],["/help","Show every command"],["/new","Start a new chat"],["/theme","Switch light / dark"]];
let POP={mode:null,items:[],sel:0,start:0};
function openPop(mode,q){
  let items;

  pop.innerHTML=`<div class="ph">${mode==="/"?"Commands":"Records"}</div>`+items.map((it,i)=>`<button data-pop="${i}" class="${i===0?"sel":""}" role="option">${it.label}<small>${esc(it.sub)}</small></button>`).join("");

function onInput(){

  if(g("#slashBtn")){ const i=$("#input"); i.value="/"; i.focus(); return onInput(); }
  if(g("#micBtn")) return micClick();
  if(g("#sendBtn")) return send();
});
$("#input").addEventListener("input",onInput);
$("#input").addEventListener("keydown",e=>{
  if(POP.mode&&$("#pop").classList.contains("show")){
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); POP.sel=(POP.sel+(e.key==="ArrowDown"?1:-1)+POP.items.length)%POP.items.length; document.querySelectorAll("#pop [data-pop]").forEach((b,i)=>b.classList.toggle("sel",i===POP.sel)); return; }
    if(e.key==="Enter"||e.key==="Tab"){ e.preventDefault(); return choosePop(POP.sel); }
    if(e.key==="Escape"){ return closePop(); }
  }
  // Phone convention: Return makes a new line; the send button sends.
  if(e.key==="Enter"&&!e.shiftKey&&!(isMobile()&&MQ.matches)){ e.preventDefault(); send(); }
});

/* ==========================================================================
   BOOT
   ========================================================================== */
(function boot(){
  let th=null; try{ th=localStorage.getItem("aiva-theme"); }catch(e){}
  document.documentElement.dataset.theme = th || "dark";
  document.querySelectorAll(".mark-slot").forEach(s=>s.innerHTML=markSVG(+s.dataset.size));
  try{ S.preview=localStorage.getItem("aiva-preview")==="1"; }catch(e){}
  applyMode(); if(MQ.addEventListener) MQ.addEventListener("change",applyMode);
  $("#legend").innerHTML=Object.keys(AIVA_NODES).map(nodeTag).join("");
  const h=(location.hash||"").slice(1); if(PERSONAS[h]) S.persona=h;
  startBriefing(S.persona);
  setComposerState();
})();
</script>
